defaults:
  - _self_

# Path to a GSViT state_dict (saved via torch.save(autoencoder.state_dict(), ...)).
# Only the encoder (`evit.*`) keys are loaded; decoder weights are ignored.
state_dict_path: /home/u941663/thesis/GSViT/evit_train2/saved_network9_17.pkl

dataset:
  module: dataset_cholec80:Cholec80Dataset
  kwargs:
    frames_root: /home/u941663/thesis/data/cholec80/frames
    phase_root: /home/u941663/thesis/data/cholec80/phase_annotations
    train_ratio: 0.6
    img_size: 224
  num_classes: 7

img_size: 224
seed: 3072
device: cuda

loader:
  batch_size: 256
  num_workers: 4
  pin_memory: True

probe:
  type: linear        # "linear" or "mlp"
  hidden_dim: null    # mlp only; defaults to 2 * in_dim if null
  dropout: 0.0        # mlp only
  epochs: 20
  lr: 1.0e-3
  weight_decay: 1.0e-4
  inner_batch_size: 4096

feature_cache: null  # e.g. ./cache/cholec80_features.pt
results_path: probe_results_cholec80.csv

wandb:
  enabled: True
  config:
    entity: mrsinal-tilburg-university
    project: GSViT
    name: probe_gsvit_cholec80
