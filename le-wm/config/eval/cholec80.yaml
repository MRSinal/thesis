defaults:
  - _self_

ckpt_path: /home/u941663/thesis/le-wm/checkpoints/lewm_surgical_epoch_9_object.ckpt # path to pretrained JEPA *_object.ckpt

dataset:
  module: dataset_cholec80:Cholec80Dataset
  kwargs:
    frames_root: /home/u941663/thesis/data/cholec80/frames
    phase_root: /home/u941663/thesis/data/cholec80/phase_annotations
    split: all
    train_ratio: 0.6
    img_size: 224
  num_classes: 7

img_size: 224
seed: 3072
device: cuda

loader:
  batch_size: 256
  num_workers: 4
  pin_memory: True

probe:
  type: linear        # "linear" or "mlp"
  hidden_dim: null    # mlp only; defaults to 2 * in_dim if null
  dropout: 0.0        # mlp only
  epochs: 20
  inner_batch_size: 4096
  lr_grid: [1.0e-4, 3.0e-4, 1.0e-3, 3.0e-3, 5.0e-3]
  weight_decay_grid: [0.01, 0.1, 0.4, 0.8]
  cv_folds: 5
  selection_metric: accuracy   # accuracy | f1 | jaccard

feature_cache: null  # e.g. ./cache/cholec80_features.pt
results_path: probe_results_cholec80.csv

wandb:
  enabled: True
  config:
    entity: mrsinal-tilburg-university
    project: jepa
    name: probe_cholec80
