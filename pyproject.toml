[project]
name = "thesis"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "ffmpeg-python>=0.2.0",
    "ffprobe-python>=1.0.3",
    "hachoir>=3.3.0",
    "matplotlib>=3.10.8",
    "pandas>=3.0.2",
    "plotly>=6.7.0",
]

[tool.uv.workspace]
members = ["le-wm", "GSViT"]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }
